name: Auto-Solve LeetCode Daily Challenge

on:
  schedule:
    # Runs daily at 05:00 AM UTC (10:30 AM Indian Standard Time)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows you to manually trigger the run from your GitHub browser page

permissions:
  contents: write # Grants the workflow permissions to commit and push back to repository

jobs:
  solve:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run solver script
      env:
        LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
        LEETCODE_CSRFTOKEN: ${{ secrets.LEETCODE_CSRFTOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        LEETCODE_LANGUAGE: 'python3'
      run: |
        cd leetcode-streak-solver
        node solve.js

    - name: Commit and Push solution code
      run: |
        git config --global user.name "VarshuAi"
        git config --global user.email "gowdavarshan466@gmail.com"
        git add leetcode-streak-solver/solutions/
        
        # Check if there are new files added to stage
        if ! git diff --cached --quiet; then
          git commit -m "docs: auto-add solution for today's LeetCode challenge"
          git push
        else
          echo "No new solutions to commit today."
        fi
