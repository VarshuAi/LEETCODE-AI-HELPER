<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" /> <!-- deep indigo -->
      <stop offset="100%" stop-color="#0f0f11" /> <!-- carbon black -->
    </linearGradient>
    
    <!-- Glowing Letter Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" /> <!-- light violet -->
      <stop offset="100%" stop-color="#6366f1" /> <!-- indigo -->
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Carbon Matte Rounded Base -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#bgGrad)" stroke="#2d2d35" stroke-width="2" />

  <!-- Code brackets in background with opacity -->
  <path d="M 22 35 L 12 50 L 22 65" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
  <path d="M 78 35 L 88 50 L 78 65" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />

  <!-- Sleek Glowing 'V' Path -->
  <path d="M 32 30 L 50 72 L 68 30" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
